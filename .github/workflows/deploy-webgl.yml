# Unity WebGL 빌드 → GitHub Pages 배포
#
# 처음 한 번만 설정이 필요합니다 (README의 "웹 배포" 참고):
#   1) Settings → Secrets and variables → Actions 에 UNITY_EMAIL, UNITY_PASSWORD, UNITY_LICENSE 등록
#   2) Settings → Pages → Source 를 "GitHub Actions" 로 변경
# 이후 main 브랜치에 push 하면 자동으로 빌드되어
#   https://<github-user>.github.io/<repo>/ 에 배포됩니다.
name: Build & Deploy WebGL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check Unity license secrets
        id: license
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::warning::UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD 시크릿이 없어 WebGL 빌드를 건너뜁니다. README의 '웹 배포'를 참고해 등록해주세요."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Unity 에디터 이미지 + 프로젝트(약 1.7GB)가 기본 러너 디스크에 빠듯해서 공간을 확보합니다.
      - name: Free disk space
        if: steps.license.outputs.ok == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        if: steps.license.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache Library
        if: steps.license.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build
        if: steps.license.outputs.ok == 'true'
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          buildName: CatGame
          buildsPath: build

      - name: Upload Pages artifact
        if: steps.license.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/CatGame

    outputs:
      built: ${{ steps.license.outputs.ok }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
